name: verify-binaries
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify alpha packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/mcpdeck.rb)
          case "$version" in ''|*[!A-Za-z0-9.+_-]*) exit 1 ;; esac
          printf 'MCPDECK_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          gh release download "v$version" --repo altanmehmet/homebrew-mcpdeck --dir downloads
          sh scripts/verify-packages.sh downloads keys/allowed_signers
      - name: Run native binary and installer
        run: |
          case "$(uname -s)" in Darwin) platform=darwin ;; Linux) platform=linux ;; *) exit 1 ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; *) exit 1 ;; esac
          mkdir unpacked
          tar -xzf "downloads/mcpdeck-$platform-$arch.tar.gz" -C unpacked
          sh unpacked/install.sh --prefix "$RUNNER_TEMP/mcpdeck install"
          "$RUNNER_TEMP/mcpdeck install/bin/mcpdeck" --version | grep -F "$MCPDECK_VERSION"
          "$RUNNER_TEMP/mcpdeck install/bin/mcpdeck" --help

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned public Windows package with PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $originalUser = [Environment]::GetEnvironmentVariable('Path', 'User')
          $originalProcess = $env:Path
          $prefix = Join-Path $env:RUNNER_TEMP 'mcpdeck install'
          try {
            & ./install.ps1 -Prefix $prefix
            $version = (Select-String -Path Formula/mcpdeck.rb -Pattern '^  version "(.*)"$').Matches.Groups[1].Value
            if ((mcpdeck --version) -ne "mcpdeck version $version" -or $LASTEXITCODE -ne 0) { throw 'Installed version differs from the tap.' }
            & ./install.ps1 -Prefix $prefix
            if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.StartsWith($prefix) }).Count -ne 1) { throw 'Repeated install duplicated User PATH.' }
            mcpdeck --help
            if ($LASTEXITCODE -ne 0) { throw 'Installed command failed.' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $originalUser, 'User')
            $env:Path = $originalProcess
          }
